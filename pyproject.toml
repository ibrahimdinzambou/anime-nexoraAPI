[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/anime_sama_api"]

[project]
name = "anime-sama-cli"
version = "2.0.1"
description = "Regarder ou télécharger des animés en VF/VOSTFR depuis le terminal (anime-sama.to)"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
keywords = ["anime-sama", "anime", "downloader", "cli", "vf", "vostfr"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Topic :: Multimedia :: Video :: Capture",
    "Topic :: System :: Archiving",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
requires-python = ">=3.10"
dependencies = [
    "flask>=3.1.0",
    "httpx>=0.28.1",
    "platformdirs>=4.5.1",
    "rich>=14.2.0",
    "textual>=0.47.0",
    "tomli>=2.2.1 ; python_version < '3.11'",
    "yt-dlp>=2025.8.22",
]

[project.optional-dependencies]
api = [
    "flask>=3.1.0",
    "gunicorn>=23.0.0; platform_system != 'Windows'",
]

[project.scripts]
anime-sama-api = "anime_sama_api.api:main"

anime-sama-cli = "anime_sama_api.cli_standalone:main"
anime-sama = "anime_sama_api.cli_standalone:main"

[project.urls]
Repository = "https://github.com/CheikhNaro/anime-sama-cli/"
Documentation = "https://github.com/CheikhNaro/anime-sama-cli#readme"

[dependency-groups]
dev = [
    "ruff>=0.14.13",
    "mypy>=1.19.1",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.0.0",
    "yt-dlp-types>=0.0.18",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "module"
pythonpath = ["src"]
